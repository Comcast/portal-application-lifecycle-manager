[pytest]
testpaths = scripts/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose 
    --strict-markers
    --junitxml=coverage/python/junit.xml
    --cov=scripts
    --cov-report=xml:coverage/python/coverage.xml
    --cov-report=html:coverage/python/htmlcov
    --cov-report=term-missing
markers =
    unit: Unit tests
    integration: Integration tests

[coverage:run]
source = scripts
omit = 
    */tests/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:xml]
output = coverage/python/coverage.xml
